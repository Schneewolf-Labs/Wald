<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Wald{% endblock %}</title>
<style>
/*
  Palette is neutral-with-a-green-bias rather than pure grey, and the accent is evergreen:
  Wald is a forest, and a hub for an org that runs its own hardware should look like a tool
  rather than a product page. No webfonts -- this runs on internal networks that may have no
  route to the outside, and a silent fallback would be worse than the system stack.

  Monospace carries the identifiers. This content is mostly slugs, hostnames, ports and
  vault paths, so setting them apart is information design, not decoration.
*/
:root {
  --ground: #fbfcfb;
  --surface: #f2f5f2;
  --raised: #ffffff;
  --ink: #16201a;
  --muted: #5c6b60;
  --faint: #8a9890;
  --accent: #1f6d47;
  --accent-soft: #e4efe8;
  --border: #dde5df;
  --warn: #8a5a12;

  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --measure: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0e1310;
    --surface: #161d18;
    --raised: #1a231d;
    --ink: #dfe8e1;
    --muted: #93a599;
    --faint: #6d7f74;
    --accent: #4fb383;
    --accent-soft: #172b21;
    --border: #253128;
    --warn: #d3a04a;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1310; --surface: #161d18; --raised: #1a231d;
  --ink: #dfe8e1; --muted: #93a599; --faint: #6d7f74;
  --accent: #4fb383; --accent-soft: #172b21; --border: #253128; --warn: #d3a04a;
}
:root[data-theme="light"] {
  --ground: #fbfcfb; --surface: #f2f5f2; --raised: #ffffff;
  --ink: #16201a; --muted: #5c6b60; --faint: #8a9890;
  --accent: #1f6d47; --accent-soft: #e4efe8; --border: #dde5df; --warn: #8a5a12;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

header.top {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.bar {
  max-width: 1080px; margin: 0 auto; padding: 14px 24px;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.brand {
  font-weight: 620; letter-spacing: -0.01em; font-size: 17px;
  color: var(--ink); text-decoration: none; white-space: nowrap;
}
.brand span { color: var(--accent); }
.bar form { flex: 1 1 320px; display: flex; gap: 8px; }
.bar input[type=search] {
  flex: 1; min-width: 0;
  padding: 8px 12px; font: inherit; font-size: 15px;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--border); border-radius: 6px;
}
.bar input[type=search]::placeholder { color: var(--faint); }
.bar button {
  padding: 8px 16px; font: inherit; font-size: 15px; cursor: pointer;
  color: var(--ground); background: var(--accent);
  border: 1px solid var(--accent); border-radius: 6px;
}
.bar button:hover { filter: brightness(1.08); }

main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 72px; }

h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
     font-weight: 600; margin: 40px 0 14px; }
.lede { color: var(--muted); margin: 0 0 28px; max-width: var(--measure); }

.crumb { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
.crumb a { color: var(--muted); }

/* Facet groups: `space` and `kind` are real properties of the content, so they are the
   organizing structure rather than an invented one. */
.facet { margin-bottom: 26px; }
.facet > h3 {
  font: 600 12px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--faint); margin: 0 0 10px;
}
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  display: block; padding: 14px 16px; text-decoration: none; color: inherit;
  background: var(--raised); border: 1px solid var(--border); border-radius: 8px;
}
.card:hover { border-color: var(--accent); }
.card .name { font-weight: 600; margin-bottom: 3px; }
.card .slug { font: 12px/1.4 var(--mono); color: var(--faint); }
.card .desc {
  font-size: 14px; color: var(--muted); margin-top: 7px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font: 12px/1 var(--mono); padding: 4px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.tag.plain { background: var(--surface); color: var(--muted); }

.stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 8px; padding: 0; list-style: none; }
.stats b { display: block; font-size: 26px; font-weight: 640; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }

/* Reference data is scanned, not read: label left, value right, identifiers in mono. */
dl.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 20px; margin: 0; }
dl.kv dt { font: 12px/1.7 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dl.kv dd code { font: 13px/1.6 var(--mono); }

.prose { max-width: var(--measure); }
.prose h1 { font-size: 26px; margin: 32px 0 10px; }
.prose h2 { font-size: 20px; text-transform: none; letter-spacing: -0.01em; color: var(--ink);
            font-weight: 620; margin: 32px 0 10px; }
.prose h3 { font-size: 16px; margin: 24px 0 8px; }
.prose p, .prose li { overflow-wrap: break-word; }
.prose code {
  font: 13.5px/1.5 var(--mono); padding: 1.5px 5px; border-radius: 4px;
  background: var(--surface); border: 1px solid var(--border);
}
.prose pre {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto;
}
.prose pre code { background: none; border: 0; padding: 0; }
.prose blockquote {
  margin: 20px 0; padding: 2px 0 2px 18px;
  border-left: 3px solid var(--accent); color: var(--muted);
}
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.prose th, .prose td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.prose th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.prose td:first-child { font-variant-numeric: tabular-nums; }
/* Wide content scrolls inside itself; the page never scrolls sideways. */
.scroller { overflow-x: auto; }

.hits { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.hit { padding: 14px 0; border-bottom: 1px solid var(--border); }
.hit a { font-weight: 600; text-decoration: none; }
.hit a:hover { text-decoration: underline; }
.hit .meta { font: 12px/1.6 var(--mono); color: var(--faint); margin-top: 2px; }
.hit .snippet { color: var(--muted); font-size: 14.5px; margin: 6px 0 0; }
.score { float: right; font: 12px/1.6 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }

.empty { color: var(--muted); padding: 28px 0; }
.note {
  font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--warn);
  padding: 8px 0 8px 14px; margin: 20px 0; max-width: var(--measure);
}
footer { border-top: 1px solid var(--border); color: var(--faint); font-size: 13px; }
footer .bar { padding: 18px 24px; }
footer a { color: var(--faint); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="/">Wald<span>.</span></a>
    <form action="/ui/search" method="get" role="search">
      <input type="search" name="q" value="{{ q|default('', true) }}"
             placeholder="Search the wiki, resources and agents…" aria-label="Search Wald">
      <button type="submit">Search</button>
    </form>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <div class="bar">
    <span>Wald — enterprise information hub</span>
    <span style="margin-left:auto"><a href="/docs">API</a> · <a href="/health">health</a></span>
  </div>
</footer>
</body>
</html>
